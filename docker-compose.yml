  # Staging environment
  web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URLs for Docker network, fallback to .env values
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL:-${CELERY_BROKER_URL}}
      CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND:-${CELERY_RESULT_BACKEND}}
      DOCKER_ENV: "true"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 4G
    profiles: [staging]

