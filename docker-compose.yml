services:
  # Redis service for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles: [development, staging, production]

  # Development environment
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # For development: use host.docker.internal to connect to host's database
      # All other DB settings (NAME, USER, PASSWORD, PORT) come from .env file  
      DB_HOST: host.docker.internal
    depends_on:
      - redis
    command: >
      sh -c "
        echo 'Starting Django application...' &&
        python management_app/manage.py migrate &&
        python management_app/manage.py runserver 0.0.0.0:8000
      "
    profiles: [development]

