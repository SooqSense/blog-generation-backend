services:
  # Development environment
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
    command: >
      sh -c "
        echo 'Starting Django application...' &&
        python management_app/manage.py migrate &&
        python management_app/manage.py runserver 0.0.0.0:8000
      "
    profiles: [development]

  # Staging environment
  web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    ports:
      - "8000:8000"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
    profiles: [staging]

  # Production environment
  web-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: always
    profiles: [production]

volumes:
  postgres_data:
