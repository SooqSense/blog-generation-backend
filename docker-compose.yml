services:
  # Redis service for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles: [development, staging, production]

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    profiles: [development, staging, production]
    restart: always

  # Development environment
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # For development: use host.docker.internal to connect to host's database
      # All other DB settings (NAME, USER, PASSWORD, PORT) come from .env file
      DOCKER_ENV: "true"
    depends_on:
      - redis
      - db
    command: >
      sh -c "
        echo 'Starting Django application...' &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    profiles: [development]
    restart: always

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCKER_ENV: "true"
    depends_on:
      - redis
      - db
    command: celery -A management_app.config.celery worker --loglevel=info --pool=threads
    profiles: [development]
    restart: always

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCKER_ENV: "true"
    depends_on:
      - redis
      - db
    command: celery -A management_app.config.celery beat --loglevel=info
    profiles: [development]
    restart: always

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCKER_ENV: "true"
    depends_on:
      - redis
      - celery-worker
    command: celery -A management_app.config.celery flower --port=5555
    profiles: [development]
    restart: always

  # Staging environment
  web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URLs for Docker network, fallback to .env values
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL:-${CELERY_BROKER_URL}}
      CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND:-${CELERY_RESULT_BACKEND}}
      DOCKER_ENV: "true"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 4G
    profiles: [staging]

  # Streamlit for staging
  streamlit-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Streamlit doesn't need database connection for basic functionality
      # But we'll keep the env vars for AI tools that might need them
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: always
    profiles: [streamlit-staging]

  # Streamlit for development
  streamlit-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    profiles: [streamlit-dev]

  # Production environment
  web-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: always
    profiles: [production]

  celery-worker-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
    depends_on:
      - redis
      - db
    command: celery -A management_app.config.celery worker --loglevel=info --pool=threads
    profiles: [production]
    restart: always

volumes:
  redis_data:
  db_data: