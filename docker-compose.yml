services:
  # Redis service for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles: [development, staging, production]

  # Development environment
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: >
      sh -c "
        echo 'Starting Django application...' &&
        python management_app/manage.py migrate &&
        python management_app/manage.py runserver 0.0.0.0:8000
      "
    profiles: [development]

  # Celery worker for development
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    command: >
      sh -c "
        echo 'Starting Celery worker...' &&
        cd management_app &&
        celery -A config worker --loglevel=info
      "
    profiles: [development]

  # Celery beat scheduler for development
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    command: >
      sh -c "
        echo 'Starting Celery beat scheduler...' &&
        cd management_app &&
        celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
    profiles: [development]

  # Staging environment
  web-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 4G
    profiles: [staging]

  # Celery worker for staging
  celery-worker-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web-staging
    command: celery -A management_app.config worker --loglevel=info
    profiles: [staging]

  # Celery beat for staging
  celery-beat-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web-staging
    command: celery -A management_app.config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    profiles: [staging]

  # Production environment
  web-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: always
    profiles: [production]

  # Celery worker for production
  celery-worker-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web-production
    command: celery -A management_app.config worker --loglevel=info
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: always
    profiles: [production]

  # Celery beat for production
  celery-beat-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web-production
    command: celery -A management_app.config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always
    profiles: [production]

volumes:
  postgres_data:
  redis_data:
