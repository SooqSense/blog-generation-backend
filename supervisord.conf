[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700
chown=django:django

[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/app/logs
user=django
nodaemon=true
silent=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

# Django Server (Gunicorn)
[program:django]
command=gunicorn --bind 0.0.0.0:8000 --worker-class=gthread --workers 1 --threads 2 --timeout 300 --keep-alive 2 --max-requests 1000 --max-requests-jitter 100 --preload config.wsgi:application
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/django.log
stderr_logfile=/app/logs/django.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
killasgroup=true
priority=200

# Celery Worker (very conservative settings)
[program:celery-worker]
command=celery -A config worker -l info --concurrency=1 --max-tasks-per-child=10 --max-memory-per-child=50000
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/celery-worker.log
stderr_logfile=/app/logs/celery-worker.log
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=300
killasgroup=true
priority=300
environment=PYTHONPATH="/app"

# Celery Beat (minimal scheduler)
[program:celery-beat]
command=celery -A config beat -l info --max-interval=300
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/celery-beat.log
stderr_logfile=/app/logs/celery-beat.log
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=300
killasgroup=true
priority=400
environment=PYTHONPATH="/app"

[group:web-services]
programs=django
priority=100

[group:celery-services]
programs=celery-worker,celery-beat
priority=300
