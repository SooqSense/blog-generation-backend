[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700
chown=django:django

[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/app/logs
user=django
nodaemon=true
silent=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

# Django Migrations (runs once at startup)
[program:django-migrate]
command=python manage.py migrate --run-syncdb
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/django-migrate.log
stderr_logfile=/app/logs/django-migrate.log
autostart=true
autorestart=false
startsecs=0
exitcodes=0,1
priority=100

# Django Server (Gunicorn)
[program:django]
command=gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 600 --access-logfile - --error-logfile -
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/django.log
stderr_logfile=/app/logs/django.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
killasgroup=true
priority=200
environment=PYTHONPATH="/app",DJANGO_SETTINGS_MODULE="config.settings"

# Celery Worker
[program:celery-worker]
command=celery -A config worker -l info --concurrency=2 --max-tasks-per-child=1000
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/celery-worker.log
stderr_logfile=/app/logs/celery-worker.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=600
killasgroup=true
priority=300
environment=PYTHONPATH="/app"

# Celery Beat (Scheduler)
[program:celery-beat]
command=celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval=60
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/celery-beat.log
stderr_logfile=/app/logs/celery-beat.log
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=600
killasgroup=true
priority=400
environment=PYTHONPATH="/app"

[group:migration]
programs=django-migrate
priority=100

[group:web-services]
programs=django
priority=200

[group:celery-services]
programs=celery-worker,celery-beat
priority=300 