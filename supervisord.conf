[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700
chown=django:django

[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/app/logs
user=django
nodaemon=true
silent=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

# Django Migrations (runs once at startup)
[program:django-migrate]
command=python manage.py migrate
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/django-migrate.log
stderr_logfile=/app/logs/django-migrate.log
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=100

# Django Server (Gunicorn)
[program:django]
command=gunicorn --bind 0.0.0.0:8000 --worker-class=gthread --workers 1 --timeout 600 --threads 4 config.wsgi:application
directory=/app/management_app
user=django
numprocs=1
stdout_logfile=/app/logs/django.log
stderr_logfile=/app/logs/django.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
killasgroup=true
priority=200

[group:web-services]
programs=django-migrate,django
priority=100 # Force new deployment Thu Jun 12 16:41:51 PKT 2025
