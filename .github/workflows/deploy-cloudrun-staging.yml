name: Deploy to Cloud Run (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  PROJECT_ID: artilence
  REGION: asia-south2
  REPOSITORY: sooqsense-bloggenerator
  SERVICE_NAME: sooqsense-streamlit-staging
  IMAGE_NAME: streamlit

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate using Workload Identity Federation (no JSON keys!)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/798090991303/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: ci-deployer@artilence.iam.gserviceaccount.com

      # Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Configure Docker to use gcloud as credential helper
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Build and push Docker image to Artifact Registry
      - name: Build & Push Docker Image
        run: |
          echo "🔨 Building Docker image..."
          docker build --target streamlit -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

          echo "📤 Pushing to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=1500 \
            --max-instances=1 \
            --min-instances=0 \
            --concurrency=80

      # Get the service URL
      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "🎉 Deployment successful!"
          echo "🌐 Service URL: $SERVICE_URL"
