name: Deploy Django to Cloud Run (production)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  PROJECT_ID: artilence
  REGION: asia-south2
  REPOSITORY: sooqsense-bloggenerator
  SERVICE_NAME: sooqsense-django-production
  IMAGE_NAME: django

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/798090991303/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions-deployer@artilence.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Docker Image
        run: |
          echo "🔨 Building Django production Docker image..."
          docker build --platform linux/amd64 --target production -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

          echo "📤 Pushing to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying Django to Cloud Run Production..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=4 \
            --timeout=3000 \
            --max-instances=2 \
            --min-instances=0 \
            --concurrency=100 \
            --set-env-vars="DJANGO_ENVIRONMENT=production" \
            --set-env-vars="DEBUG=False" \
            --set-env-vars="DJANGO_SECRET_KEY=django-insecure-dummy-key" \
            --set-env-vars="DB_HOST=ep-holy-hat-adj6g712-pooler.c-2.us-east-1.aws.neon.tech" \
            --set-env-vars="DB_PORT=5432" \
